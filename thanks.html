    <meta name="robots" content="noindex" />
    <link rel="canonical" href="https://darelaholou4-ux.github.io/Darel-survey/thanks.html" />

    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="manifest" href="site.webmanifest" />
    <link rel="stylesheet" href="base.css" />

  <body data-title-key="title.thanks">
    <a class="skip-link" href="#thanks" data-i18n="a11y.skipContent">Skip to the content</a>

      <nav class="topbar__nav" aria-label="Main navigation" data-i18n-aria-label="nav.label">

      <div class="lang-switch" role="group" aria-label="Language" data-i18n-aria-label="lang.label">

        <div class="thanks-actions">
          <a class="btn" href="index.html" data-i18n="thanks.back">Answer the survey again</a>
